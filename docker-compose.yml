# Local / demo stack: PostgreSQL + pgvector (with RLS), API, and optional Celery worker.
#
#   docker compose up --build                     # API + Postgres, demo data, offline answers
#   docker compose --profile worker up --build    # + Redis and a Celery ingestion worker
#
# Copy .env.example to .env to set an LLM API key or change secrets.

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql://rag_app:${APP_DB_PASSWORD:-rag_app_dev_password}@db:5432/rag
  JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me}
  SEED_DEMO: ${SEED_DEMO:-true}
  EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fastembed}
  LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
  LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
  INGESTION_BACKEND: ${INGESTION_BACKEND:-inline}
  REDIS_URL: redis://redis:6379/0

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      # The app connects as this unprivileged role so Row-Level Security applies.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-rag_app_dev_password}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    profiles: ["worker"]

  worker:
    build: .
    profiles: ["worker"]
    command: celery -A app.ingestion.celery_app worker --loglevel=info --concurrency=2
    environment:
      <<: *app-env
      INGESTION_BACKEND: celery
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

volumes:
  pgdata:
