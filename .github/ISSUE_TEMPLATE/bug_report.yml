name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Steps to reproduce, what you expected, and what you saw instead.
    validations:
      required: true
  - type: input
    attributes:
      label: Setup
      description: "Database (SQLite/PostgreSQL), EMBEDDING_PROVIDER, LLM_PROVIDER, how you run it (docker compose / uvicorn)"
  - type: textarea
    attributes:
      label: Logs
      render: text
