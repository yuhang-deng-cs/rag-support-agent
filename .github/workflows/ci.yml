name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: test (SQLite + PostgreSQL RLS)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: rag_test
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # The app connects as an unprivileged role, exactly as in production.
      TEST_DATABASE_URL: postgresql://rag_app:rag_app_ci@localhost:5432/rag_test
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Create the application database role
        env:
          PGPASSWORD: postgres
        run: >
          psql -h localhost -U postgres -d rag_test -v ON_ERROR_STOP=1
          -v app_user=rag_app -v app_password=rag_app_ci
          -f infra/postgres/app_role.psql
      - run: pip install -e ".[dev]"
      - run: pytest -v

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[local]"
      - name: Retrieval / guardrail evaluation
        run: python scripts/eval.py | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t rag-support-agent .
