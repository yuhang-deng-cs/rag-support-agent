[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-support-agent"
version = "0.4.0"
description = "Multi-tenant RAG support agent with database-enforced tenant isolation (Postgres RLS + pgvector)."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["rag", "llm", "pgvector", "multi-tenant", "row-level-security", "fastapi"]
classifiers = [
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "pgvector>=0.3",
    "numpy>=1.26",
    "pyjwt>=2.8",
    "bcrypt>=4.1",
    "httpx>=0.27",
    "pypdf>=4.0",
]

[project.optional-dependencies]
# Local ONNX embeddings (no API key needed). Recommended default.
local = ["fastembed>=0.4"]
# Distributed ingestion workers.
celery = ["celery[redis]>=5.4"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/yuhang-deng-cs/rag-support-agent"
Issues = "https://github.com/yuhang-deng-cs/rag-support-agent/issues"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",   # assert is fine in tests
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "RUF001", # allow full-width punctuation in multilingual strings
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"scripts/**" = ["S311"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
markers = [
    "postgres: requires a real PostgreSQL + pgvector database (set TEST_DATABASE_URL)",
]
