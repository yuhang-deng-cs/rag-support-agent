# Alembic CLI config. The app runs migrations itself on startup; use the CLI for manual control:
#   alembic upgrade head        alembic downgrade -1        alembic history
#   alembic revision --autogenerate -m "describe change"
# The database comes from DATABASE_URL (or .env), like the app.
[alembic]
script_location = app/db/migrations
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
